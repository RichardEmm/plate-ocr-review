[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-ocr-review"
version = "1.0.0"
description = "Recursive ANPR image OCR and Google Sheets comparison"
requires-python = ">=3.11"
dependencies = [
  "fast-plate-ocr[onnx]>=1.1,<2",
  "PySide6>=6.8,<7",
  "Pillow>=11,<13",
  "mcp>=1.20,<2",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
plate-ocr-review = "plate_ocr_review.app:main"

[tool.setuptools.packages.find]
include = ["plate_ocr_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
